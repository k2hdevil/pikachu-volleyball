<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>피카츄 배구</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #222;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas {
      border: 2px solid #555;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* 터치 컨트롤 - 게임패드 스타일 레이아웃 */
    #touchControls {
      display: none;
      width: 100%;
      max-width: 432px;
      justify-content: space-between;
      align-items: flex-end;
      padding: 16px 12px;
    }

    /* 왼쪽: 방향 패드 (이동) */
    .touch-dpad {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    /* 오른쪽: 액션 버튼 (점프 + 스파이크) */
    .touch-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .touch-actions-row {
      display: flex;
      gap: 10px;
    }

    .touch-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.4);
      background: rgba(255,255,255,0.12);
      color: #fff;
      font-size: 22px;
      display: flex;
      justify-content: center;
      align-items: center;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.05s;
    }
    .touch-btn:active,
    .touch-btn.pressed {
      background: rgba(255,215,0,0.4);
      border-color: #FFD700;
    }

    /* 점프 버튼 - 더 크게 */
    .touch-btn.jump {
      width: 66px;
      height: 66px;
      font-size: 26px;
      background: rgba(100,200,255,0.15);
      border-color: rgba(100,200,255,0.5);
    }
    .touch-btn.jump:active {
      background: rgba(100,200,255,0.4);
      border-color: #64C8FF;
    }

    /* 스파이크 버튼 - 강조 */
    .touch-btn.spike {
      width: 66px;
      height: 66px;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
      background: rgba(255,100,100,0.15);
      border-color: rgba(255,100,100,0.5);
    }
    .touch-btn.spike:active {
      background: rgba(255,100,100,0.4);
      border-color: #FF6464;
    }

    /* 모바일 힌트 텍스트 */
    .touch-hint {
      color: rgba(255,255,255,0.3);
      font-size: 10px;
      text-align: center;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <!-- 모바일 터치 컨트롤 (게임패드 레이아웃) -->
  <div id="touchControls">
    <!-- 왼쪽: 방향 패드 -->
    <div>
      <div class="touch-dpad">
        <button class="touch-btn" id="btnLeft" aria-label="왼쪽 이동">◀</button>
        <button class="touch-btn" id="btnRight" aria-label="오른쪽 이동">▶</button>
      </div>
      <div class="touch-hint">이동</div>
    </div>

    <!-- 오른쪽: 액션 버튼 -->
    <div>
      <div class="touch-actions-row">
        <button class="touch-btn spike" id="btnSpike" aria-label="스파이크">SPIKE</button>
        <button class="touch-btn jump" id="btnJump" aria-label="점프">▲</button>
      </div>
      <div class="touch-hint">점프 / 스파이크</div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
